[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aad"
version = "0.1.0"
description = "agent aided design: a local review workspace for CAD written by coding agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sawyer Smith" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
keywords = ["cad", "review", "build123d", "cadquery", "glb", "three.js", "coding-agents"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

[project.optional-dependencies]
fast = ["scipy"]
test = ["pytest>=7"]
demo = ["build123d"]

[project.scripts]
aad = "aad.cli:main"

[project.urls]
Repository = "https://github.com/partypancake8/aad"

[tool.setuptools.packages.find]
include = ["aad*"]

[tool.setuptools.package-data]
aad = [
    "viewer/*.html", "viewer/*.js", "viewer/*.css", "viewer/vendor/**/*",
    "review/*.json", "review/schemas/*.json",
    "examples/bracket_demo/*.json", "examples/bracket_demo/*.py", "examples/bracket_demo/*/*.glb",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
